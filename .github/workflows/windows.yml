name: Windows installer

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Check publication safety and Git history
        run: npm run check:public
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run desktop:build -- --ci
      - name: Rust unit checks
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --features tauri/custom-protocol
      - name: Onboarding and browser layout checks
        run: node scripts/test-onboarding.mjs
      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $filename = "RegionBox_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/$filename" -Destination "release/$filename"
          $digest = (Get-FileHash -LiteralPath "release/$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $filename" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RegionBox-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/*_x64-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RegionBox-${{ needs.build.outputs.version }}-windows-x64
          path: release
      - name: Publish the tested installer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const repo = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...repo, tag })).data;
              if (!release.draft) throw new Error('This version is already published. Release a new version to change its installer.');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: `RegionBox ${tag}`, draft: true,
                prerelease: tag.includes('-'),
                body: 'Download the Windows x64 setup EXE below. Setup guides you through Windows support, Docker Desktop, and your own NordVPN service credentials. No account credentials or browser data are bundled. The installer is currently unsigned. Stop and start existing workspaces once after upgrading to apply browser updates; saved profiles are preserved.'
              })).data;
            }
            const files = fs.readdirSync('release');
            const expected = [`RegionBox_${tag.slice(1)}_x64-setup.exe`, 'SHA256SUMS.txt'];
            if (files.length !== 2 || expected.some(name => !files.includes(name))) throw new Error('Unexpected release files.');
            for (const name of expected) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: existing.id });
              const data = fs.readFileSync(`release/${name}`);
              await github.rest.repos.uploadReleaseAsset({ ...repo, release_id: release.id, name, data });
            }
            await github.rest.repos.updateRelease({ ...repo, release_id: release.id, draft: false });
