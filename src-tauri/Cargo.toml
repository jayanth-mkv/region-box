[package]
name = "regionbox"
version = "0.1.0"
description = "Independent regional browser workspaces"
edition = "2021"
default-run = "regionbox"

[lib]
name = "regionbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
# Keep release packaging usable alongside Docker on a 16 GB Windows PC.
lto = false
codegen-units = 8
